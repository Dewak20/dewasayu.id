name: CI

# Menjalankan lint, uji perilaku, validasi kalender, dan build produksi pada
# tiap push dan pull request ke main. Tujuannya menangkap regresi sebelum
# sampai ke Vercel, bukan setelah situs terlanjur rusak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  periksa:
    name: Lint, uji perilaku, uji kalender, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Disamakan dengan lingkungan tempat lockfile ini dibuat dan
          # diverifikasi (Node 24 / npm 11). Lockfile npm 11 dibaca npm 10
          # adalah satu-satunya perbedaan yang tersisa antara sini dan lokal.
          node-version: "24"
          cache: npm

      - name: Versi perkakas
        run: |
          node --version
          npm --version
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"

      # Log runner tidak bisa dibaca tanpa token, sedangkan annotation bisa.
      # Galat npm diangkat jadi annotation supaya kegagalan berikutnya bisa
      # didiagnosis tanpa menebak-nebak.
      - name: Pasang dependensi
        run: |
          set +e
          npm ci 2>&1 | tee npm-ci.log
          kode=${PIPESTATUS[0]}
          if [ "$kode" -ne 0 ]; then
            echo "::error title=npm ci gagal::$(grep -iE 'npm (error|ERR)' npm-ci.log | head -20 | tr '\n' ' ~ ' | cut -c1-1800)"
          fi
          exit "$kode"

      - name: Lint
        run: npm run lint

      - name: Uji perilaku (Vitest)
        run: npm run test:unit

      - name: Validasi mesin kalender Bali
        run: npm run test:kalender

      - name: Build produksi
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://dewasayu.id
