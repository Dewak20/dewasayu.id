name: CI

# Menjalankan lint, uji perilaku, validasi kalender, dan build produksi pada
# tiap push dan pull request ke main. Tujuannya menangkap regresi sebelum
# sampai ke Vercel, bukan setelah situs terlanjur rusak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  periksa:
    name: Lint, uji perilaku, uji kalender, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Disamakan dengan lingkungan tempat lockfile ini dibuat dan
          # diverifikasi (Node 24 / npm 11). Lockfile npm 11 dibaca npm 10
          # adalah satu-satunya perbedaan yang tersisa antara sini dan lokal.
          node-version: "24"
          cache: npm

      - name: Versi perkakas
        run: |
          node --version
          npm --version
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"

      # Sengaja `npm install`, bukan `npm ci`.
      #
      # package-lock.json dibuat di Windows. Next memakai sharp, yang punya
      # fallback `@img/sharp-wasm32`; di Linux fallback itu menarik
      # @emnapi/runtime dan @emnapi/core ke level atas. npm tidak mencatat
      # dependensi milik paket khusus-platform lain ke dalam lock, sehingga
      # entri itu tidak ada dan `npm ci` berhenti dengan EUSAGE
      # "Missing: @emnapi/runtime from lock file".
      #
      # Regenerasi lock dengan --os=linux --cpu=x64 sudah dicoba dan tidak
      # menambahkannya. Satu-satunya cara tetap memakai `npm ci` adalah
      # membuat lock di Linux, yang tidak mungkin dari mesin pengembangan
      # Windows. Versi tetap dibatasi lockfile; `npm install` hanya
      # melengkapi yang kurang untuk platform runner.
      #
      # Log runner butuh token, annotation tidak — galat npm diangkat jadi
      # annotation supaya kegagalan berikutnya bisa dibaca tanpa menebak.
      - name: Pasang dependensi
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee npm-log.txt
          kode=${PIPESTATUS[0]}
          if [ "$kode" -ne 0 ]; then
            echo "::error title=Pemasangan gagal::$(grep -iE 'npm (error|ERR)' npm-log.txt | head -20 | tr '\n' ' ~ ' | cut -c1-1800)"
          fi
          exit "$kode"

      - name: Lint
        run: npm run lint

      - name: Uji perilaku (Vitest)
        run: npm run test:unit

      - name: Validasi mesin kalender Bali
        run: npm run test:kalender

      - name: Build produksi
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://dewasayu.id
