name: CI

# Menjalankan lint, uji perilaku, validasi kalender, dan build produksi pada
# tiap push dan pull request ke main. Tujuannya menangkap regresi sebelum
# sampai ke Vercel, bukan setelah situs terlanjur rusak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  periksa:
    name: Lint, uji perilaku, uji kalender, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Vitest 5 butuh Node >=22.12 dan jsdom butuh >=22.13; Node 20 sudah
          # usang di runner GitHub. Angka ini harus sejalan dengan "engines"
          # di package.json.
          node-version: "22"
          cache: npm

      - name: Versi perkakas
        run: node --version && npm --version

      - name: Pasang dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Uji perilaku (Vitest)
        run: npm run test:unit

      - name: Validasi mesin kalender Bali
        run: npm run test:kalender

      - name: Build produksi
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://dewasayu.id
